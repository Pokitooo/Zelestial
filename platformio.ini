[env]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.140201.0
board = genericSTM32F411CE
board_build.mcu = stm32f411ceu6
board_build.f_cpu = 96000000L
framework = arduino
monitor_speed = 460800
upload_protocol = dfu
build_unflags =
	-std=gnu++17
build_flags =
    -D HSE_VALUE=25000000UL
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_SCANF
	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
	-std=gnu++20

; FATFS MACROS
    "-D f_unmount(path)=f_mount(0, path, 0)"

; CMSIS RTOS V2
    -D configUSE_CMSIS_RTOS_V2=1
    -D configUSE_NEWLIB_REENTRANT=1
    -Wl,--wrap=delay
lib_deps = 
	lib-xcore=https://gitlab.com/vtneil/lib-xcore.git
    FatFs=https://github.com/stm32duino/FatFs.git
    STM32SD=https://github.com/stm32duino/STM32SD.git
    STM32FreeRTOS=stm32duino/STM32duino FreeRTOS
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit AHTX0
    adafruit/Adafruit LPS2X
    adafruit/Adafruit MPU6050
    adafruit/Adafruit LIS3DH
    sparkfun/SparkFun u-blox GNSS v3
    vtneil/vt-lora-ebyte@^2.0.0  ; = https://github.com/vtneil/vt-lora-ebyte.git (registry build excludes demo src/)

[env:MAIN]
build_flags =
    ${env.build_flags}
    -I ${PROJECT_INCLUDE_DIR}/config/Main
build_src_filter =
    +<*.c>
    +<*.cpp>
    +<main/*.c>
    +<main/*.cpp>

[env:lora]
build_src_filter =
    +<*.c>
    +<*.cpp>
    +<lora/*.c>
    +<lora/*.cpp>
